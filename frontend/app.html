<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your account — Serenhold Markets</title>
  <meta name="description" content="Serenhold Markets — an educational crypto-broker simulation." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved/OS theme before first paint to avoid a flash.
    (function () {
      var t = null; try { t = localStorage.getItem('sh-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    /* Branded splash: inline so it shows before any script or stylesheet loads. */
    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #F7F5F0; color: #102A2A;
              font-family: Manrope, system-ui, sans-serif; transition: opacity .35s ease; }
    [data-theme="dark"] #splash { background: #091818; color: #E6F0EC; }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .box { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 24px; }
    #splash .mark { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
    #splash .logo { width: 44px; height: 44px; position: static; animation: none; }
    #splash .ring { position: absolute; inset: 0; animation: sh-spin 1.4s linear infinite; }
    #splash circle { fill: none; stroke: #178C68; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 60 140; }
    #splash .name { font: 600 20px/1.2 Fraunces, Georgia, serif; margin-top: 4px; }
    #splash .what { font-size: 13px; opacity: .65; }
    #splash .line { font: italic 14px/1.4 Fraunces, Georgia, serif; opacity: .8; max-width: 22rem; }
    @keyframes sh-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .ring { animation: none; } #splash { transition: none; } }
  </style>
</head>
<body>
    <div id="splash" role="status" aria-live="polite">
    <div class="box">
      <div class="mark"><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/></svg><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0E4D4A"/><path d="M8 13.2c2.7-2.8 5.3-2.8 8 0s5.3 2.8 8 0M8 19.6c2.7-2.8 5.3-2.8 8 0s5.3 2.8 8 0" stroke="#7FE3BF" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></div>
      <div class="name">Serenhold Markets</div>
      <div class="line">Calm, accountable crypto investing.</div>
      <div class="what">Opening your account…</div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
